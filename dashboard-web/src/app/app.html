<div class="shell">
  <a class="skip-link" href="#main" (click)="skipToContent($event)">Skip to main content</a>
  <header class="topbar">
    <a class="brand" routerLink="/sagas">
      <span class="brand-mark">v<span class="brand-mark-accent">Saga</span></span>
      <span class="brand-sub">Saga Dashboard</span>
    </a>
    @if (auth.isAuthenticated()) {
      <nav class="topnav" aria-label="Primary">
        <a routerLink="/sagas" routerLinkActive="active" ariaCurrentWhenActive="page">Sagas</a>
        @if (auth.canManageAccess()) {
          <a routerLink="/admin" routerLinkActive="active" ariaCurrentWhenActive="page"
            >Administration</a
          >
        }
      </nav>
    }
    <div class="topbar-end">
      @if (auth.isAuthenticated()) {
        <app-guide-toggle />
        <app-user-menu />
      }
    </div>
  </header>
  @if (auth.isAuthenticated()) {
    <app-guide-hint />
  }
  <main id="main" class="content" tabindex="-1">
    <router-outlet />
  </main>
</div>
@defer (when guide.enabled()) {
  <app-guide-overlay />
}
