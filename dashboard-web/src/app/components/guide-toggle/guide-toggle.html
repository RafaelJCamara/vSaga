<button
  type="button"
  class="btn guide-switch"
  [attr.aria-pressed]="guide.enabled()"
  (click)="guide.toggle()"
>
  Guide
</button>
@if (guide.canReplay()) {
  <button type="button" class="btn btn--quiet" (click)="guide.replay()">Replay tour</button>
}
<a class="btn btn--quiet" [href]="userGuideUrl" target="_blank" rel="noopener noreferrer"
  >User guide</a
>
<div role="status" class="guide-hint-region">
  @if (guide.showHint()) {
    <div class="guide-hint">
      <p>New here? Turn on Guide for a walkthrough of each page.</p>
      <div class="guide-hint-actions">
        <button type="button" class="btn" (click)="guide.setEnabled(true)">Start the tour</button>
        <button type="button" class="btn btn--quiet" (click)="guide.dismissHint()">
          No thanks
        </button>
      </div>
    </div>
  }
</div>
