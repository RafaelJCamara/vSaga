<button
  type="button"
  class="btn guide-switch"
  [attr.aria-pressed]="guide.enabled()"
  (click)="guide.toggle()"
>
  Guide
</button>
@if (guide.canReplay()) {
  <button type="button" class="btn btn--quiet" (click)="guide.replay()">Replay tour</button>
}
<a class="btn btn--quiet" [href]="userGuideUrl" target="_blank" rel="noopener noreferrer"
  >User guide</a
>
