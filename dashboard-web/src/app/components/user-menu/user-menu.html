<button
  #trigger
  type="button"
  class="btn user-menu-trigger"
  id="user-menu-trigger"
  aria-haspopup="menu"
  aria-controls="user-menu-panel"
  [attr.aria-expanded]="open()"
  [attr.aria-disabled]="signingOut() ? 'true' : null"
  (click)="toggle()"
  (keydown.arrowdown)="showFromKey($event)"
>
  <span class="user-menu-name">{{ signingOut() ? 'Signing out…' : label() }}</span>
  <span aria-hidden="true"> ▾</span>
</button>

@if (open()) {
  <div class="menu user-menu-panel" id="user-menu-panel">
    <div class="user-menu-who">
      <div class="user-menu-display">{{ user()?.displayName }}</div>
      <div class="muted">{{ user()?.username }}</div>
    </div>
    <div
      role="menu"
      aria-labelledby="user-menu-trigger"
      (keydown.arrowdown)="moveFocus($event, 1)"
      (keydown.arrowup)="moveFocus($event, -1)"
      (keydown.home)="moveFocusTo($event, 'first')"
      (keydown.end)="moveFocusTo($event, 'last')"
      (keydown.space)="activateWithSpace($event)"
      (keydown.shift.tab)="leaveBackwards($event)"
    >
      <a role="menuitem" tabindex="-1" routerLink="/account" (click)="select()">Account</a>
      <button role="menuitem" tabindex="-1" type="button" (click)="signOut()">Sign out</button>
    </div>
  </div>
}
