services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vsaga
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432" # host 5433 to avoid clashing with any other locally-running Postgres on 5432
    volumes:
      - vsaga-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672" # management UI: http://localhost:15672 (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  dashboard-api:
    build:
      context: ./dotnet
      dockerfile: src/VSaga.Dashboard.Api/Dockerfile
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__VSaga: "Host=postgres;Port=5432;Database=vsaga;Username=postgres;Password=postgres"
      RabbitMq__ConnectionString: "amqp://guest:guest@rabbitmq:5672/"
      Dashboard__ApiKey: "dev-local-only-change-me"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  order-processing:
    build:
      context: ./dotnet
      dockerfile: samples/VSaga.Samples.OrderProcessing/Dockerfile
    environment:
      ConnectionStrings__VSaga: "Host=postgres;Port=5432;Database=vsaga;Username=postgres;Password=postgres"
      RabbitMq__ConnectionString: "amqp://guest:guest@rabbitmq:5672/"
      # Needed so the sample's REST calls to this same process -- LoyaltyLookupSaga's .CallHttp(...) to
      # /loyalty/lookup (docs/design/http-based-sagas.md §5) and MixedFulfilmentSaga's to /payments/authorize
      # and /payments/void (docs/design/mixed-sagas.md §7) -- have a known, stable port at
      # http://localhost:8080 -- an environment key, not a host `ports:` mapping, so no overlay needs
      # editing (unlike the `!override` convention `ports:` sequences require).
      ASPNETCORE_URLS: "http://+:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # dashboard-api owns schema migrations (VSaga.Persistence.EFCore.Postgres); this service does
      # no schema bootstrapping of its own, so waiting for dashboard-api to report healthy just
      # ensures its migrations have already landed before order-processing starts publishing messages.
      dashboard-api:
        condition: service_healthy

volumes:
  vsaga-postgres-data:
