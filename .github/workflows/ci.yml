name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dotnet:
    name: .NET build & test
    runs-on: ubuntu-latest
    env:
      # Ryuk (Testcontainers' cleanup sidecar) pulls its own image from Docker Hub before every
      # container it starts, and a transient registry hiccup there fails every Testcontainers-backed
      # test in the run at once (Postgres, Redis, MongoDB, Brighter, MassTransit, RabbitMQ tests all together) even
      # though nothing about them is actually broken. Ryuk's job is reaping containers left behind by
      # a crashed run; on a GitHub-hosted runner the whole VM is destroyed after the job anyway, so
      # it's redundant here and disabling it removes this whole flake class.
      TESTCONTAINERS_RYUK_DISABLED: true
    steps:
      - uses: actions/checkout@v4
        with:
          # MinVer derives the .NET packages' version from git tags; the default shallow checkout
          # (fetch-depth: 1) hides tags reachable only through fuller history, and MinVer silently
          # falls back to a fake 0.0.0 version instead of failing when that happens.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: dotnet/global.json

      - name: Restore
        run: dotnet restore dotnet/VSaga.slnx

      - name: Build
        run: dotnet build dotnet/VSaga.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test dotnet/VSaga.slnx --no-build --configuration Release --logger "console;verbosity=normal"

  angular:
    name: Angular build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard-web
    steps:
      - uses: actions/checkout@v4
        with:
          # Kept consistent with the dotnet job's checkout above, which needs full history for MinVer.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx ng build

      - name: Test
        run: npx ng test --watch=false
